openapi: 3.0.0
info:
  title: Daily metrics
  version: 1.0.0
  description: >-
    Read the athlete's consolidated data for one calendar day: the manual daily log
    (Garmin recovery, Xert fitness signature, Diet Quality Score, waist measurement),
    the Intervals.icu wellness and fitness record, that day's rides from Intervals.icu
    (TSS, IF, normalized power), the FatSecret food diary totals, blood pressure and
    temperature readings, the latest Withings scale reading, and that day's Strava rides.
paths:
  /daily-metrics:
    get:
      operationId: get_daily_metrics
      summary: Get all training, recovery, body and nutrition data for one day
      description: >-
        Use this before giving any training or nutrition recommendation, to ground
        advice in the athlete's actual HRV, sleep, readiness, form (TSB) and recent
        rides. Prefer a value in daily_log when present (the athlete typed it); otherwise
        use intervals (recovery) or fatsecret (nutrition). If both are missing, say the
        value is unknown instead of guessing.
      parameters:
        - name: date
          in: query
          required: false
          description: Calendar day in YYYY-MM-DD format. Defaults to today (Europe/London).
          schema:
            type: string
      responses:
        '200':
          description: Consolidated metrics for the day
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                  daily_log:
                    type: object
                    description: >-
                      Manual log fields, e.g. hrv_overnight_avg_ms, resting_hr_bpm, sleep_score,
                      training_readiness, xert_tp_w, dqs_total, waist_cm, and the day's nutrition
                      totals protein_g, carbs_g, fat_g, fibre_g. Days before Intervals.icu
                      may also have tp_ctl, tp_atl, tp_tsb, tp_tss and tp_if typed in from TrainingPeaks.
                  daily_log_missing:
                    type: boolean
                  intervals:
                    type: object
                    description: >-
                      Intervals.icu record for the day (synced from Garmin): hrv (ms), restingHR (bpm),
                      sleepSecs, sleepScore, readiness, weight (kg), ctl (fitness), atl (fatigue),
                      rampRate. Form (TSB) is ctl minus atl.
                  fatsecret:
                    type: object
                    description: >-
                      FatSecret food diary for the day, or null if nothing was logged. totals has
                      calories_kcal, carbohydrate_g, protein_g, fat_g, fiber_g, sugar_g,
                      saturated_fat_g, monounsaturated_fat_g, polyunsaturated_fat_g, cholesterol_mg,
                      sodium_mg, potassium_mg, and calcium, iron, vitamin A and vitamin C as % of
                      daily value (*_pct_dv). meals has the main totals per meal (breakfast, lunch,
                      dinner, other); entries_count is the number of foods logged, and coverage says
                      how many of them had each nutrient (a total from few foods is a minimum).
                  readings:
                    type: array
                    description: >-
                      Manual readings that day, oldest first. type BP has systolic_mmhg, diastolic_mmhg
                      and pulse_bpm; type TEMP has temp_c. local_time is the athlete's local time.
                    items:
                      type: object
                  withings_latest:
                    type: object
                    description: Most recent scale session on or before the day (weight_kg, fat_ratio_pct, ...).
                  intervals_activities:
                    type: array
                    description: >-
                      Rides started that day as analysed by Intervals.icu: tss, intensity_factor,
                      normalized_power_w, average_power_w, ftp_w (the FTP used for TSS and IF),
                      variability_index, efficiency_factor, decoupling_pct, kilojoules, carbs_used_g,
                      average_hr_bpm, hr_load, rpe, feel, moving_time_s, distance_m, elevation_m.
                    items:
                      type: object
                  strava_activities:
                    type: array
                    description: >-
                      Rides started that day (moving_time s, distance m, weighted_average_watts W,
                      kilojoules, suffer_score). hr_zone_seconds and power_zone_seconds give the
                      seconds spent in each zone; the matching *_zone_bounds list each zone's
                      [min, max] in bpm or watts, where max -1 means no upper limit.
                    items:
                      type: object
